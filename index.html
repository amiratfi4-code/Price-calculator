<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#d71920">
<meta name="description" content="ماشین‌حساب دقیق قیمت‌گذاری کالا">
<title>ماشین‌حساب دقیق قیمت‌گذاری</title>

<script src="https://unpkg.com/html5-qrcode" defer></script>

<style>
*{box-sizing:border-box}
:root{
  --red:#d71920;
  --red-dark:#b51218;
  --bg:#f5f6f8;
  --card:#fff;
  --text:#171717;
  --muted:#70757d;
  --border:#e4e7eb;
  --green:#087a35;
  --danger:#b42318;
}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font:14px Tahoma,Arial,sans-serif;
}
button,input{font:inherit}
button{cursor:pointer}
button:disabled,input:disabled{opacity:.55;cursor:not-allowed}
.app{max-width:920px;margin:auto;padding-bottom:40px}
header{
  position:sticky;top:0;z-index:60;
  background:white;border-bottom:1px solid var(--border);
}
.header-inner{
  min-height:62px;display:flex;align-items:center;
  gap:10px;padding:8px 12px;
}
.logo{
  width:40px;height:40px;border-radius:11px;
  background:var(--red);color:white;
  display:grid;place-items:center;font-size:20px;font-weight:bold;
}
.header-title{flex:1;min-width:0}
.header-title strong{display:block}
.header-title span{font-size:11px;color:var(--muted)}
.lock-btn{
  width:43px;height:43px;border:1px solid var(--border);
  border-radius:12px;background:white;font-size:20px;
}
main{padding:12px}
.card{
  background:var(--card);border:1px solid var(--border);
  border-radius:15px;margin-bottom:12px;
  box-shadow:0 2px 12px #0000000a;
}
.section-head{
  display:flex;align-items:center;gap:8px;
  padding:12px;border-bottom:1px solid var(--border);
}
.section-head strong{flex:1}
.section-head button{border:0;background:none;font-size:19px}
.muted,.lock-info{color:var(--muted);font-size:11px}
.search-card{padding:10px;position:sticky;top:62px;z-index:40}
.search-row{display:flex;gap:8px}
.search-wrap{position:relative;flex:1}
.search{
  width:100%;height:47px;border:1px solid var(--border);
  border-radius:12px;padding:0 42px 0 12px;background:#fafafa;
}
.search-icon{position:absolute;right:13px;top:12px;color:#888;font-size:19px}
.scan-search{
  width:47px;border:0;border-radius:12px;
  background:#111;color:white;font-size:20px;
}
.quick-result{
  display:none;margin-top:8px;border:1px solid var(--border);
  border-radius:12px;padding:11px;background:white;
}
.quick-result.show{display:block}
.quick-price{font-size:25px;color:var(--red);font-weight:bold}
.quick-words{margin-top:4px;color:var(--muted);font-size:12px}
.rate-body{padding:12px}
.rate-grid{display:grid;grid-template-columns:1fr 1fr auto;gap:8px}
.field label{
  display:block;color:var(--muted);font-size:11px;margin-bottom:5px;
}
.field input{
  width:100%;min-width:0;height:43px;
  border:1px solid var(--border);border-radius:10px;
  padding:0 10px;background:white;
}
.rate-words{margin-top:7px;color:var(--muted);font-size:12px}
.rate-btn,.primary-btn,.wide-btn{
  min-height:43px;padding:0 15px;border:0;border-radius:10px;
  background:var(--red);color:white;font-weight:bold;
}
.toolbar{
  display:flex;gap:8px;padding:10px 12px;flex-wrap:wrap;
}
.toolbar button{
  min-height:41px;border:1px solid var(--border);
  border-radius:10px;background:white;padding:0 12px;
}
.toolbar .primary{background:var(--red);color:white;border-color:var(--red)}
.toolbar .danger{color:var(--danger);background:#fff1f1}
.toolbar .settings{background:#f7f7f7}
.stats{
  display:grid;grid-template-columns:repeat(3,1fr);
  gap:8px;padding:10px 12px;
}
.stat{background:#f8f8f8;border-radius:10px;padding:10px;text-align:center}
.stat strong{display:block;font-size:18px}
.stat span{font-size:10px;color:var(--muted)}
.products{padding:0 8px 8px}
.product{
  background:white;border:1px solid var(--border);
  border-radius:13px;margin:7px 0;overflow:hidden;
}
.product-summary{
  min-height:72px;display:flex;align-items:center;
  gap:9px;padding:7px 8px;
}
.product-thumb{
  width:54px;height:54px;border-radius:10px;
  object-fit:cover;background:#f1f2f4;flex:none;
}
.product-main{flex:1;min-width:0}
.product-name{
  font-weight:bold;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;margin-bottom:4px;
}
.prices{display:flex;gap:9px;flex-wrap:wrap;font-size:12px}
.new-price{color:var(--red);font-weight:bold}
.change{margin-top:2px;font-size:11px}
.up{color:var(--danger)}
.down{color:var(--green)}
.edit-product-btn{
  width:40px;height:40px;border:1px solid var(--border);
  border-radius:10px;background:white;
}
.product-details{
  display:none;padding:9px;border-top:1px solid var(--border);
  background:#fafafa;
}
.product.open .product-details{display:block}
.edit-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.full{grid-column:1/-1}
.code-row{display:flex;gap:6px}
.code-row input{flex:1}
.code-row button{
  border:0;border-radius:10px;background:#111;color:white;padding:0 12px;
}
.detail-actions{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.detail-actions button{
  min-height:38px;padding:0 11px;
  border:1px solid var(--border);border-radius:9px;background:white;
}
.delete-btn{color:var(--danger);background:#fff1f1!important}
.scan-product-btn{background:#111!important;color:white!important}
.qr-box{
  padding:8px;border:1px dashed #ccc;
  border-radius:9px;background:white;font-size:11px;margin-top:8px;
}
.qr-code{direction:ltr;font-family:monospace;word-break:break-all}
.history-list{padding:0 12px 12px}
.history-item{padding:9px 0;border-bottom:1px solid var(--border);font-size:12px}
.history-top{display:flex;justify-content:space-between;gap:10px}
.empty{padding:35px 10px;text-align:center;color:var(--muted)}
.modal{
  position:fixed;inset:0;z-index:100;display:none;
  align-items:center;justify-content:center;padding:16px;
  background:#000b;
}
.modal.show{display:flex}
.modal-box{
  width:min(440px,95vw);max-height:90vh;overflow:auto;
  padding:18px;border-radius:16px;background:white;
}
.modal-box h3{margin:0 0 8px}
.modal-box p{font-size:12px;line-height:1.8;color:var(--muted)}
.modal-box input{
  width:100%;height:44px;margin-bottom:8px;
  padding:0 10px;border:1px solid var(--border);border-radius:10px;
}
.modal-actions{display:flex;gap:8px}
.modal-actions button{
  flex:1;min-height:42px;border:0;border-radius:10px;
}
.modal-image{max-width:90vw;max-height:75vh;display:block;margin:auto}
#reader{width:100%;overflow:hidden;border-radius:10px}
#reader video{width:100%!important}
.toast{
  position:fixed;left:50%;bottom:20px;z-index:200;
  transform:translateX(-50%);display:none;max-width:90vw;
  padding:10px 15px;border-radius:10px;
  background:#111;color:white;font-size:12px;text-align:center;
}
.toast.show{display:block}
@media(max-width:650px){
  main{padding:8px}
  .rate-grid{grid-template-columns:1fr 1fr}
  .rate-btn{grid-column:1/-1}
  .toolbar button{flex:1}
  .toolbar .settings{flex-basis:100%}
}
@media(max-width:430px){
  .edit-grid{grid-template-columns:1fr}
  .full{grid-column:auto}
}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="header-inner">
    <div class="logo">₿</div>
    <div class="header-title">
      <strong>ماشین‌حساب دقیق قیمت‌گذاری</strong>
      <span id="lockStatus">در حال آماده‌سازی...</span>
    </div>
    <button id="lockBtn" class="lock-btn" type="button" aria-label="قفل مالک">🔒</button>
  </div>
</header>

<main>
<section class="card search-card">
  <div class="search-row">
    <div class="search-wrap">
      <span class="search-icon">⌕</span>
      <input id="searchInput" class="search" type="search"
        autocomplete="off" placeholder="نام کالا یا کد QR را وارد کنید...">
    </div>
    <button id="searchScanBtn" class="scan-search" type="button" aria-label="اسکن کد">▣</button>
  </div>
  <div id="quickResult" class="quick-result">
    <div id="quickResultTitle"></div>
    <div id="quickResultPrice" class="quick-price"></div>
    <div id="quickResultWords" class="quick-words"></div>
  </div>
</section>

<section class="card">
  <div class="section-head">
    <strong>نرخ دلار</strong>
    <span id="ratePermission" class="lock-info">فقط مالک</span>
    <button id="rateToggle" type="button">⌄</button>
  </div>
  <div id="rateBody" class="rate-body" hidden>
    <div class="rate-grid">
      <div class="field">
        <label>نرخ قبلی</label>
        <input id="oldRate" disabled>
      </div>
      <div class="field">
        <label>نرخ جدید</label>
        <input id="newRate" class="editable" inputmode="decimal" placeholder="مثلاً 10,000">
        <div id="rateWords" class="rate-words"></div>
      </div>
      <button id="rateBtn" class="rate-btn" type="button">ثبت نرخ</button>
    </div>
  </div>
</section>

<section class="card">
  <div class="toolbar">
    <button id="addBtn" class="primary" type="button">＋ افزودن کالا</button>
    <button id="exportBtn" type="button">پشتیبان‌گیری</button>
    <button id="importBtn" type="button">بازیابی</button>
    <button id="changePasswordBtn" class="settings" type="button">⚙ تغییر رمز عبور</button>
    <button id="resetHistoryBtn" class="danger" type="button">↻ ریست تاریخچه</button>
    <input id="importFile" type="file" accept="application/json" hidden>
  </div>
</section>

<section class="card">
  <div class="stats">
    <div class="stat"><strong id="productCount">0</strong><span>کالا</span></div>
    <div class="stat"><strong id="rateDisplay">0</strong><span>نرخ دلار</span></div>
    <div class="stat"><strong id="historyCount">0</strong><span>تغییر نرخ</span></div>
  </div>
</section>

<section class="card">
  <div class="section-head">
    <strong>کالاها</strong><span id="resultCount" class="lock-info"></span>
  </div>
  <div id="products" class="products"></div>
</section>

<section class="card">
  <div class="section-head">
    <strong>تاریخچه نرخ دلار</strong>
    <button id="historyToggle" type="button">⌄</button>
  </div>
  <div id="historyList" class="history-list" hidden></div>
</section>
</main>
</div>

<div id="passwordModal" class="modal">
  <div class="modal-box">
    <h3 id="passwordTitle">ورود مالک</h3>
    <p id="passwordDescription">رمز مالک را وارد کنید.</p>
    <div id="passwordError" class="up"></div>
    <input id="passwordInput" type="password" autocomplete="current-password" placeholder="رمز مالک">
    <div id="changePasswordFields" hidden>
      <input id="newPasswordInput" type="password" autocomplete="new-password" placeholder="رمز جدید (حداقل ۸ کاراکتر)">
      <input id="confirmPasswordInput" type="password" autocomplete="new-password" placeholder="تکرار رمز جدید">
    </div>
    <div class="modal-actions">
      <button id="passwordSubmit" class="primary-btn" type="button">ورود</button>
      <button id="passwordCancel" type="button">انصراف</button>
    </div>
  </div>
</div>

<div id="setupModal" class="modal">
  <div class="modal-box">
    <h3>ساخت رمز مالک</h3>
    <p>یک رمز حداقل ۸ کاراکتری بسازید و آن را در جای امن نگه دارید.</p>
    <div id="setupError" class="up"></div>
    <input id="setupPassword" type="password" autocomplete="new-password" placeholder="رمز مالک">
    <input id="setupPasswordConfirm" type="password" autocomplete="new-password" placeholder="تکرار رمز مالک">
    <button id="setupSubmit" class="wide-btn" type="button">ساخت رمز و ادامه</button>
  </div>
</div>

<div id="scannerModal" class="modal">
  <div class="modal-box">
    <h3>اسکن QR یا بارکد</h3>
    <div id="reader"></div>
    <p id="scannerStatus">در حال آماده‌سازی دوربین...</p>
    <button id="scannerClose" class="wide-btn" type="button">بستن</button>
  </div>
</div>

<div id="imageModal" class="modal">
  <div class="modal-box">
    <button id="closeImageModal" class="wide-btn" type="button">بستن تصویر</button>
    <img id="largeImage" class="modal-image" alt="تصویر کالا">
  </div>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<!-- کد JavaScript بخش دوم را دقیقاً اینجا قرار بده -->

</body>
</html>
