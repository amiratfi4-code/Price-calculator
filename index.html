<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#d71920">
<meta name="description" content="ماشین‌حساب حرفه‌ای و دقیق قیمت‌گذاری کالا">
<link rel="manifest" href="./manifest.webmanifest">
<title>ماشین‌حساب دقیق قیمت‌گذاری</title>

<script src="https://unpkg.com/html5-qrcode" defer></script>

<style>
*{box-sizing:border-box}
:root{
  --red:#d71920;
  --red-dark:#b51218;
  --bg:#f5f6f8;
  --card:#fff;
  --text:#171717;
  --muted:#70757d;
  --border:#e4e7eb;
  --green:#087a35;
  --danger:#b42318;
  --shadow:0 2px 12px rgba(0,0,0,.06);
}
html{scroll-behavior:smooth}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Tahoma,Arial,sans-serif;
  font-size:14px;
}
button,input{font:inherit}
button{cursor:pointer}
button:disabled,input:disabled{
  cursor:not-allowed;
  opacity:.55;
}
.app{
  max-width:920px;
  margin:auto;
  padding-bottom:40px;
}
header{
  position:sticky;
  top:0;
  z-index:60;
  background:#fff;
  border-bottom:1px solid var(--border);
  box-shadow:0 2px 10px rgba(0,0,0,.06);
}
.header-inner{
  min-height:62px;
  display:flex;
  align-items:center;
  gap:10px;
  padding:8px 12px;
}
.logo{
  width:40px;
  height:40px;
  border-radius:11px;
  background:var(--red);
  color:#fff;
  display:grid;
  place-items:center;
  font-size:20px;
  font-weight:bold;
  flex:none;
}
.header-title{
  flex:1;
  min-width:0;
}
.header-title strong{
  display:block;
  font-size:15px;
}
.header-title span{
  color:var(--muted);
  font-size:11px;
}
.lock-btn{
  width:43px;
  height:43px;
  border:1px solid var(--border);
  border-radius:12px;
  background:#fff;
  font-size:20px;
}
main{padding:12px}
.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:15px;
  box-shadow:var(--shadow);
  margin-bottom:12px;
}
.search-card{
  padding:10px;
  position:sticky;
  top:62px;
  z-index:40;
}
.search-row{
  display:flex;
  gap:8px;
}
.search-wrap{
  position:relative;
  flex:1;
}
.search{
  width:100%;
  height:47px;
  border:1px solid var(--border);
  border-radius:12px;
  padding:0 42px 0 12px;
  outline:none;
  background:#fafafa;
}
.search:focus{
  border-color:var(--red);
  background:#fff;
}
.search-icon{
  position:absolute;
  right:13px;
  top:12px;
  color:#888;
  font-size:19px;
}
.scan-search{
  width:47px;
  height:47px;
  border:0;
  border-radius:12px;
  background:#111;
  color:#fff;
  font-size:20px;
}
.quick-result{
  display:none;
  margin-top:8px;
  border:1px solid #e0e0e0;
  border-radius:12px;
  padding:11px;
  background:#fff;
}
.quick-result.show{display:block}
.quick-result-title{
  font-weight:bold;
  margin-bottom:5px;
}
.quick-price{
  color:var(--red);
  font-size:25px;
  font-weight:bold;
}
.quick-words{
  color:var(--muted);
  margin-top:4px;
  font-size:12px;
}
.section-head{
  display:flex;
  align-items:center;
  gap:8px;
  padding:12px;
  border-bottom:1px solid var(--border);
}
.section-head strong{flex:1}
.section-head button{
  border:0;
  background:none;
  font-size:19px;
}
.lock-info{
  color:var(--muted);
  font-size:11px;
}
.rate-body{padding:12px}
.rate-grid{
  display:grid;
  grid-template-columns:1fr 1fr auto;
  gap:8px;
}
.field label{
  display:block;
  color:var(--muted);
  font-size:11px;
  margin-bottom:5px;
}
.field input{
  width:100%;
  height:43px;
  border:1px solid var(--border);
  border-radius:10px;
  padding:0 10px;
  outline:none;
  background:#fff;
}
.field input:focus{border-color:var(--red)}
.rate-btn,.add-btn{
  min-height:43px;
  align-self:end;
  padding:0 15px;
  border:0;
  border-radius:10px;
  background:var(--red);
  color:#fff;
  font-weight:bold;
}
.rate-words{
  margin-top:7px;
  color:var(--muted);
  font-size:12px;
}
.toolbar{
  display:flex;
  gap:8px;
  padding:10px 12px;
  flex-wrap:wrap;
}
.toolbar button{
  min-height:41px;
  border:1px solid var(--border);
  border-radius:10px;
  background:#fff;
  padding:0 12px;
}
.toolbar .primary{
  background:var(--red);
  color:#fff;
  border-color:var(--red);
}
.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  padding:10px 12px;
}
.stat{
  background:#f8f8f8;
  border-radius:10px;
  padding:10px;
  text-align:center;
}
.stat strong{
  display:block;
  font-size:18px;
}
.stat span{
  color:var(--muted);
  font-size:10px;
}
.products{padding:0 8px 8px}
.product{
  background:#fff;
  border:1px solid var(--border);
  border-radius:13px;
  margin:7px 0;
  overflow:hidden;
}
.product-summary{
  min-height:78px;
  display:flex;
  align-items:center;
  gap:9px;
  padding:8px;
}
.product-thumb{
  width:58px;
  height:58px;
  border-radius:10px;
  object-fit:cover;
  background:#f1f2f4;
  flex:none;
}
.product-main{
  flex:1;
  min-width:0;
}
.product-name{
  font-weight:bold;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  margin-bottom:5px;
}
.prices{
  display:flex;
  gap:9px;
  flex-wrap:wrap;
  font-size:12px;
}
.current-price{color:#444}
.new-price{
  color:var(--red);
  font-weight:bold;
}
.change{
  margin-top:3px;
  font-size:11px;
}
.change.up{color:var(--danger)}
.change.down{color:var(--green)}
.edit-product-btn{
  width:40px;
  height:40px;
  flex:none;
  border:1px solid var(--border);
  border-radius:10px;
  background:#fff;
  font-size:17px;
}
.product-details{
  display:none;
  padding:10px;
  border-top:1px solid var(--border);
  background:#fafafa;
}
.product.open .product-details{display:block}
.detail-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}
.detail-grid .full{grid-column:1/-1}
.detail-actions{
  display:flex;
  gap:7px;
  margin-top:9px;
  flex-wrap:wrap;
}
.detail-actions button{
  min-height:41px;
  padding:0 12px;
  border:1px solid var(--border);
  border-radius:9px;
  background:#fff;
}
.delete-btn{
  color:var(--danger);
  background:#fff1f1!important;
  border-color:#ffd1d1!important;
}
.words{
  color:var(--muted);
  font-size:11px;
  margin-top:4px;
}
.qr-box{
  padding:9px;
  border:1px dashed #ccc;
  border-radius:9px;
  background:#fff;
}
.qr-code{
  direction:ltr;
  font-family:monospace;
  word-break:break-all;
  margin-top:4px;
}
.history-list{padding:0 12px 12px}
.history-item{
  padding:9px 0;
  border-bottom:1px solid var(--border);
  font-size:12px;
}
.history-item:last-child{border-bottom:0}
.history-top{
  display:flex;
  justify-content:space-between;
  gap:10px;
}
.history-percent.up{color:var(--danger)}
.history-percent.down{color:var(--green)}
.empty{
  padding:35px 10px;
  text-align:center;
  color:var(--muted);
}
.image-modal,
.scanner-modal,
.password-modal,
.setup-modal{
  position:fixed;
  inset:0;
  z-index:100;
  display:none;
  align-items:center;
  justify-content:center;
  padding:16px;
  background:rgba(0,0,0,.72);
}
.image-modal.show,
.scanner-modal.show,
.password-modal.show,
.setup-modal.show{
  display:flex;
}
.image-modal-content{
  position:relative;
  max-width:95vw;
  max-height:90vh;
}
.image-modal img{
  max-width:95vw;
  max-height:85vh;
  border-radius:12px;
  display:block;
}
.close-image{
  position:absolute;
  top:-45px;
  left:0;
  width:38px;
  height:38px;
  border:0;
  border-radius:50%;
  background:#fff;
  font-size:25px;
}
.scanner-box{
  width:min(500px,95vw);
  padding:12px;
  border-radius:15px;
  background:#fff;
}
#reader{width:100%}
.scanner-close{
  width:100%;
  min-height:43px;
  margin-top:10px;
  border:0;
  border-radius:10px;
  background:#111;
  color:#fff;
}
.password-box,
.setup-box{
  width:min(420px,94vw);
  padding:18px;
  border-radius:18px;
  background:#fff;
}
.password-box h3,
.setup-box h3{
  margin:0 0 7px;
}
.password-box p,
.setup-box p{
  color:var(--muted);
  font-size:12px;
  line-height:1.8;
}
.password-box input,
.setup-box input{
  width:100%;
  height:46px;
  margin-bottom:8px;
  padding:0 12px;
  border:1px solid var(--border);
  border-radius:11px;
  outline:none;
}
.password-box input:focus,
.setup-box input:focus{
  border-color:var(--red);
}
.password-error,
.setup-error{
  min-height:18px;
  margin-bottom:5px;
  color:var(--danger);
  font-size:11px;
}
.password-actions{
  display:flex;
  gap:8px;
}
.password-actions button{
  flex:1;
  min-height:43px;
  border:0;
  border-radius:10px;
}
.password-submit{
  color:#fff;
  background:var(--red);
}
.password-cancel{background:#eee}
.setup-submit{
  width:100%;
  min-height:44px;
  border:0;
  border-radius:10px;
  background:var(--red);
  color:#fff;
  font-weight:bold;
}
.change-password-fields{display:none}
.change-password-fields.show{display:block}
.password-toggle{
  position:relative;
}
.password-toggle button{
  position:absolute;
  left:8px;
  top:5px;
  height:36px;
  border:0;
  background:none;
}
.toast{
  position:fixed;
  left:50%;
  bottom:20px;
  z-index:200;
  transform:translateX(-50%);
  display:none;
  max-width:90vw;
  padding:10px 15px;
  border-radius:10px;
  background:#111;
  color:#fff;
  font-size:12px;
}
.toast.show{display:block}
body.locked .edit-product-btn{
  opacity:.45;
}
@media(max-width:650px){
  main{padding:8px}
  .rate-grid{grid-template-columns:1fr 1fr}
  .rate-btn{grid-column:1/-1}
  .detail-grid{grid-template-columns:1fr}
  .detail-grid .full{grid-column:auto}
}
</style>
</head>

<body>

<div class="app">

<header>
  <div class="header-inner">
    <div class="logo">₿</div>

    <div class="header-title">
      <strong>ماشین‌حساب دقیق قیمت‌گذاری</strong>
      <span id="lockStatus">در حال آماده‌سازی...</span>
    </div>

    <button
      id="lockBtn"
      class="lock-btn"
      type="button"
      title="ورود مالک"
    >🔒</button>
  </div>
</header>

<main>

<section class="card search-card">

  <div class="search-row">

    <div class="search-wrap">
      <span class="search-icon">⌕</span>

      <input
        id="searchInput"
        class="search"
        type="search"
        autocomplete="off"
        inputmode="search"
        placeholder="نام کالا یا کد QR را وارد کنید..."
      >
    </div>

    <button
      id="searchScanBtn"
      class="scan-search"
      type="button"
      title="اسکن QR"
    >▣</button>

  </div>

  <div id="quickResult" class="quick-result">
    <div id="quickResultTitle" class="quick-result-title"></div>
    <div id="quickResultPrice" class="quick-price"></div>
    <div id="quickResultWords" class="quick-words"></div>
  </div>

</section>

<section class="card">

  <div class="section-head">
    <strong>نرخ دلار</strong>
    <span class="lock-info">فقط مالک</span>
    <button id="rateToggle" type="button">⌄</button>
  </div>

  <div id="rateBody" class="rate-body" style="display:none">

    <div class="rate-grid">

      <div class="field">
        <label>نرخ قبلی</label>
        <input id="oldRate" type="number" inputmode="decimal" disabled>
      </div>

      <div class="field">
        <label>نرخ جدید</label>

        <input
          id="newRate"
          class="editable rate-input"
          type="number"
          inputmode="decimal"
          min="0"
          step="any"
        >

        <div id="rateWords" class="rate-words"></div>
      </div>

      <button
        id="rateBtn"
        class="rate-btn"
        type="button"
      >ثبت نرخ</button>

    </div>

  </div>

</section>

<section class="card">

  <div class="toolbar">

    <button
      id="addBtn"
      class="primary addBtn"
      type="button"
    >＋ افزودن کالا</button>

    <button
      id="exportBtn"
      type="button"
    >پشتیبان‌گیری</button>

    <button
      id="importBtn"
      class="importBtn"
      type="button"
    >بازیابی</button>

    <input
      id="importFile"
      type="file"
      accept="application/json"
      hidden
    >

  </div>

</section>

<section class="card">

  <div class="stats">

    <div class="stat">
      <strong id="productCount">0</strong>
      <span>کالا</span>
    </div>

    <div class="stat">
      <strong id="rateDisplay">0</strong>
      <span>نرخ دلار</span>
    </div>

    <div class="stat">
      <strong id="historyCount">0</strong>
      <span>تغییر نرخ</span>
    </div>

  </div>

</section>

<section class="card">

  <div class="section-head">
    <strong>کالاها</strong>
    <span id="resultCount" class="lock-info"></span>
  </div>

  <div id="products" class="products"></div>

</section>

<section class="card">

  <div class="section-head">
    <strong>تاریخچه نرخ دلار</strong>
    <button id="historyToggle" type="button">⌄</button>
  </div>

  <div
    id="historyList"
    class="history-list"
    style="display:none"
  ></div>

</section>

</main>
</div>

<!-- IMAGE MODAL -->
<div id="imageModal" class="image-modal">

  <div class="image-modal-content">

    <button
      id="closeImageModal"
      class="close-image"
      type="button"
    >×</button>

    <img
      id="largeImage"
      src=""
      alt="تصویر بزرگ کالا"
    >

  </div>

</div>

<!-- SCANNER -->
<div id="scannerModal" class="scanner-modal">

  <div class="scanner-box">

    <div id="reader"></div>

    <button
      id="scannerClose"
      class="scanner-close"
      type="button"
    >بستن</button>

  </div>

</div>

<!-- PASSWORD -->
<div id="passwordModal" class="password-modal">

  <div class="password-box">

    <h3 id="passwordTitle">ورود مالک</h3>

    <p id="passwordDescription">
      برای دسترسی به بخش مدیریت، رمز مالک را وارد کنید.
    </p>

    <div
      id="passwordError"
      class="password-error"
    ></div>

    <div class="password-toggle">

      <input
        id="passwordInput"
        type="password"
        autocomplete="current-password"
        placeholder="رمز مالک"
      >

      <button
        id="passwordVisibility"
        type="button"
      >◉</button>

    </div>

    <div
      id="changePasswordFields"
      class="change-password-fields"
    >

      <div class="password-toggle">

        <input
          id="newPasswordInput"
          type="password"
          autocomplete="new-password"
          placeholder="رمز جدید"
        >

        <button
          id="newPasswordVisibility"
          type="button"
        >◉</button>

      </div>

      <div class="password-toggle">

        <input
          id="confirmPasswordInput"
          type="password"
          autocomplete="new-password"
          placeholder="تکرار رمز جدید"
        >

        <button
          id="confirmPasswordVisibility"
          type="button"
        >◉</button>

      </div>

    </div>

    <div class="password-actions">

      <button
        id="passwordSubmit"
        class="password-submit"
        type="button"
      >ورود</button>

      <button
        id="passwordCancel"
        class="password-cancel"
        type="button"
      >انصراف</button>

    </div>

  </div>

</div>

<!-- FIRST SETUP -->
<div id="setupModal" class="setup-modal">

  <div class="setup-box">

    <h3>ساخت رمز مالک</h3>

    <p>
      برای محافظت از قیمت‌ها و تنظیمات، ابتدا یک رمز مالک بسازید.
      حداقل ۸ کاراکتر استفاده کنید.
    </p>

    <div id="setupError" class="setup-error"></div>

    <input
      id="setupPassword"
      type="password"
      autocomplete="new-password"
      placeholder="رمز مالک"
    >

    <input
      id="setupPasswordConfirm"
      type="password"
      autocomplete="new-password"
      placeholder="تکرار رمز مالک"
    >

    <button
      id="setupSubmit"
      class="setup-submit"
      type="button"
    >ساخت رمز و ادامه</button>

  </div>

</div>

<div id="toast" class="toast"></div>

<script>
"use strict";

/* =========================================================
   DATABASE
========================================================= */

const DB_NAME = "PriceCalculatorDB";
const STORE_NAME = "appData";
const STATE_KEY = "state";
const DB_VERSION = 2;

let db = null;

const DEFAULT_STATE = {
  products: [],
  oldRate: 0,
  currentRate: 0,
  history: [],
  locked: true,
  passwordHash: null,
  autoLockMinutes: 5,
  schemaVersion: 2
};

let state = structuredClone(DEFAULT_STATE);

let scanner = null;
let scannerTarget = null;
let passwordMode = "unlock";
let autoLockTimer = null;
let hiddenTimer = null;

/* =========================================================
   HELPERS
========================================================= */

function money(value){
  const n = Number(value);

  if(!Number.isFinite(n)) return "0";

  return Math.round(n).toLocaleString("en-US");
}

function cleanNumber(value){
  const n = Number(value);

  if(!Number.isFinite(n) || n < 0){
    return 0;
  }

  return n;
}

function uid(){
  if(window.crypto?.randomUUID){
    return crypto.randomUUID();
  }

  return Date.now().toString(36) +
    Math.random().toString(36).slice(2);
}

function escapeHtml(value){
  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function showToast(message){
  const toast = document.getElementById("toast");

  toast.textContent = message;
  toast.classList.add("show");

  clearTimeout(showToast.timer);

  showToast.timer = setTimeout(()=>{
    toast.classList.remove("show");
  },2200);
}

/* =========================================================
   PERSIAN NUMBER WORDS
========================================================= */

const ones = [
  "صفر","یک","دو","سه","چهار","پنج","شش","هفت","هشت","نه",
  "ده","یازده","دوازده","سیزده","چهارده","پانزده",
  "شانزده","هفده","هجده","نوزده"
];

const tens = [
  "","","بیست","سی","چهل","پنجاه",
  "شصت","هفتاد","هشتاد","نود"
];

const hundreds = [
  "","صد","دویست","سیصد","چهارصد",
  "پانصد","ششصد","هفتصد","هشتصد","نهصد"
];

const scales = [
  "","هزار","میلیون","میلیارد","تریلیون"
];

function threeDigitsToWords(n){

  const result = [];

  const h = Math.floor(n / 100);
  const rest = n % 100;

  if(h){
    result.push(hundreds[h]);
  }

  if(rest){

    if(rest < 20){

      result.push(ones[rest]);

    }else{

      const t = Math.floor(rest / 10);
      const o = rest % 10;

      result.push(tens[t]);

      if(o){
        result.push(ones[o]);
      }

    }

  }

  return result.join(" و ");
}

function numberToWords(value){

  let n = Math.round(cleanNumber(value));

  if(n === 0){
    return "صفر تومان";
  }

  if(n < 0){
    return "منفی " + numberToWords(Math.abs(n));
  }

  const result = [];
  let group = 0;

  while(n > 0){

    const chunk = n % 1000;

    if(chunk){

      let text = threeDigitsToWords(chunk);

      if(scales[group]){
        text += " " + scales[group];
      }

      result.unshift(text);
    }

    n = Math.floor(n / 1000);
    group++;
  }

  return result.join(" و ") + " تومان";
}

/* =========================================================
   EXACT DECIMAL CALCULATION
========================================================= */

function decimalParts(value){

  const s = String(value);

  if(!s.includes(".")){
    return {
      integer:BigInt(s || "0"),
      scale:0
    };
  }

  const [a,b] = s.split(".");

  const digits = (b || "").replace(/[^0-9]/g,"");

  return {
    integer:BigInt((a || "0") + digits),
    scale:digits.length
  };
}

function exactDivide(a,b,precision=6){

  if(b === 0n){
    return 0;
  }

  const sign =
    (a < 0n) !== (b < 0n) ? -1 : 1;

  a = a < 0n ? -a : a;
  b = b < 0n ? -b : b;

  const scale = 10n ** BigInt(precision);

  const q = (a * scale) / b;

  const remainder = (a * scale) % b;

  let result = Number(q) / Number(scale);

  if(remainder !== 0n){
    result += Number(remainder) /
      Number(b * scale);
  }

  return sign * result;
}

function calculateProduct(product){

  const price = cleanNumber(product.price);
  const oldRate = cleanNumber(state.oldRate);
  const currentRate = cleanNumber(state.currentRate);

  if(
    price === 0 ||
    oldRate <= 0 ||
    currentRate <= 0
  ){
    return {
      newPrice:price,
      diff:0,
      percent:0
    };
  }

  /*
    قیمت جدید = قیمت فعلی × نرخ جدید ÷ نرخ قبلی

    محاسبه نسبت با BigInt انجام می‌شود تا خطای
    رایج floating point تا حد ممکن حذف شود.
  */

  const priceParts = decimalParts(price);
  const oldParts = decimalParts(oldRate);
  const currentParts = decimalParts(currentRate);

  const numerator =
    priceParts.integer *
    currentParts.integer;

  const denominator =
    oldParts.integer *
    (10n ** BigInt(priceParts.scale)) *
    (10n ** BigInt(currentParts.scale));

  /*
    oldRate scale باید در صورت کسر وارد شود.
  */

  const correctedNumerator =
    priceParts.integer *
    currentParts.integer *
    (10n ** BigInt(oldParts.scale));

  const correctedDenominator =
    oldParts.integer *
    (10n ** BigInt(priceParts.scale + currentParts.scale));

  const ratio =
    exactDivide(
      correctedNumerator,
      correctedDenominator,
      8
    );

  const newPrice = price * ratio;

  const diff = newPrice - price;

  const percent =
    price === 0
      ? 0
      : (diff / price) * 100;

  return {
    newPrice,
    diff,
    percent
  };
}

/* =========================================================
   INDEXED DB
========================================================= */

function openDB(){

  return new Promise((resolve,reject)=>{

    const request =
      indexedDB.open(DB_NAME,DB_VERSION);

    request.onupgradeneeded = ()=>{
      const database = request.result;

      if(!database.objectStoreNames.contains(STORE_NAME)){
        database.createObjectStore(STORE_NAME);
      }
    };

    request.onsuccess = ()=>{
      db = request.result;
      resolve();
    };

    request.onerror = ()=>{
      reject(request.error);
    };

  });
}

function loadState(){

  return new Promise((resolve,reject)=>{

    const tx =
      db.transaction(STORE_NAME,"readonly");

    const request =
      tx.objectStore(STORE_NAME).get(STATE_KEY);

    request.onsuccess = ()=>{

      if(request.result){

        state = {
          ...DEFAULT_STATE,
          ...request.result
        };

        state.products =
          Array.isArray(state.products)
            ? state.products
            : [];

        state.history =
          Array.isArray(state.history)
            ? state.history
            : [];
      }

      resolve();
    };

    request.onerror = ()=>{
      reject(request.error);
    };

  });
}

function saveState(){

  return new Promise((resolve,reject)=>{

    const tx =
      db.transaction(STORE_NAME,"readwrite");

    tx.objectStore(STORE_NAME)
      .put(state,STATE_KEY);

    tx.oncomplete = resolve;

    tx.onerror = ()=>{
      reject(tx.error);
    };

  });
}

/* =========================================================
   PASSWORD
========================================================= */

async function hashPassword(password){

  const data =
    new TextEncoder().encode(password);

  const hash =
    await crypto.subtle.digest(
      "SHA-256",
      data
    );

  return Array.from(new Uint8Array(hash))
    .map(x=>x.toString(16).padStart(2,"0"))
    .join("");
}

async function handlePasswordSubmit(){

  const error =
    document.getElementById("passwordError");

  const current =
    document.getElementById("passwordInput").value;

  error.textContent = "";

  if(!current){
    error.textContent = "رمز را وارد کنید.";
    return;
  }

  const currentHash =
    await hashPassword(current);

  if(currentHash !== state.passwordHash){

    error.textContent =
      "رمز مالک اشتباه است.";

    return;
  }

  if(passwordMode === "unlock"){

    state.locked = false;

    await saveState();

    closePasswordModal();

    updateLockUI();

    startAutoLockTimer();

    showToast("ویرایش فعال شد");

    return;
  }

  if(passwordMode === "change"){

    const newPassword =
      document.getElementById("newPasswordInput").value;

    const confirmPassword =
      document.getElementById("confirmPasswordInput").value;

    if(newPassword.length < 8){

      error.textContent =
        "رمز جدید باید حداقل ۸ کاراکتر باشد.";

      return;
    }

    if(newPassword !== confirmPassword){

      error.textContent =
        "دو رمز جدید یکسان نیستند.";

      return;
    }

    state.passwordHash =
      await hashPassword(newPassword);

    await saveState();

    closePasswordModal();

    showToast("رمز مالک تغییر کرد");
  }
}

function productMatches(product,query){

  if(!query){
    return true;
  }

  const q =
    query.trim().toLocaleLowerCase("fa");

  return (
    String(product.name || "")
      .toLocaleLowerCase("fa")
      .includes(q)
    ||
    String(product.qr || "")
      .toLocaleLowerCase("fa")
      .includes(q)
  );
}

function productImage(product){

  if(product.image){

    return `
      <img
        class="product-thumb"
        src="${escapeHtml(product.image)}"
        alt="${escapeHtml(product.name)}"
        data-image="${escapeHtml(product.image)}"

  }

  return `
    <div
      class="product-thumb"
      style="display:grid;place-items:center;font-size:23px"
    >🛍️</div>
  `;
}

/* =========================================================
   IMAGE
========================================================= */

function compressImage(file){

  return new Promise((resolve,reject)=>{

    if(!file.type.startsWith("image/")){
      reject(new Error("not-image"));
      return;
    }

    const reader = new FileReader();

    reader.onload = ()=>{

      const img = new Image();

      img.onload = ()=>{

        const max = 900;

        const scale =
          Math.min(
            1,
            max /
            Math.max(img.width,img.height)
          );

        const canvas =
          document.createElement("canvas");

        canvas.width =
          Math.max(
            1,
            Math.round(img.width * scale)
          );

        canvas.height =
          Math.max(
            1,
            Math.round(img.height * scale)
          );

        const ctx =
          canvas.getContext("2d");

        ctx.drawImage(
          img,
          0,
          0,
          canvas.width,
          canvas.height
        );

        resolve(
          canvas.toDataURL(
            "image/jpeg",
            .80
          )
        );
      };

      img.onerror = reject;

      img.src = reader.result;
    };

    reader.onerror = reject;

    reader.readAsDataURL(file);
  });
}

/* =========================================================
   QR SCANNER
========================================================= */

async function stopScanner(){

  if(scanner){

    try{
      await scanner.stop();
    }catch(e){}

    try{
      scanner.clear();
    }catch(e){}

    scanner = null;
  }
}

async function openScanner(target){

  scannerTarget = target;

  document
    .getElementById("scannerModal")
    .classList.add("show");

  if(!window.Html5Qrcode){

    showToast(
      "اسکنر هنوز آماده نشده است"
    );

    return;
  }

  await stopScanner();

  document.getElementById("reader").innerHTML = "";

  try{

    scanner =
      new Html5Qrcode("reader");

    await scanner.start(
      {facingMode:"environment"},
      {
        fps:10,
        qrbox:{
          width:250,
          height:180
        }
      },
      async decodedText=>{
        await handleScannedCode(decodedText);
      },
      ()=>{}
    );

  }catch(error){

    console.error(error);

    await stopScanner();

    document
      .getElementById("scannerModal")
      .classList.remove("show");

    showToast(
      "دسترسی به دوربین ممکن نیست"
    );
  }
}

async function handleScannedCode(code){

  await stopScanner();

  document
    .getElementById("scannerModal")
    .classList.remove("show");

  if(scannerTarget?.type === "search"){

    const input =
      document.getElementById("searchInput");

    input.value = code;

    renderProducts();
    updateQuickResult();

    return;
  }

  if(scannerTarget?.type === "product"){

    if(state.locked){
      return;
    }

    const product =
      state.products.find(
        p=>p.id === scannerTarget.id
      );

    if(!product){
      return;
    }

    product.qr = code;

    await saveState();

    renderProducts();

    const el =
      document.getElementById(
        "product-" + product.id
      );

    if(el){
      el.classList.add("open");
    }

    showToast("QR کالا ثبت شد");

    resetAutoLockTimer();
  }
}

async function exportBackup(){

    openPasswordModal("unlock");

    exportedAt:new Date().toISOString(),
    products:state.products,

async function importBackup(file){

  if(state.locked){

    openPasswordModal("unlock");
    return;
  }

  try{

    if(!file){
      return;
    }

    if(
      file.type &&
      file.type !== "application/json" &&
      !file.name.toLowerCase().endsWith(".json")
    ){
      throw new Error("invalid-type");
    }

    const text =
      await file.text();

    const imported =
      JSON.parse(text);

    if(
      !imported ||
      !Array.isArray(imported.products)
    ){
      throw new Error("invalid-data");
    }

    const passwordHash =
      state.passwordHash;

    const normalizedProducts =
      imported.products.map(p=>({
        id:String(p.id || uid()),
        name:String(p.name || "کالای بدون نام"),
        price:cleanNumber(p.price),
        qr:String(p.qr || ""),
        image:String(p.image || "")
      }));

    state = {
      ...DEFAULT_STATE,
      ...state,
      products:normalizedProducts,
      oldRate:cleanNumber(imported.oldRate),
      currentRate:cleanNumber(imported.currentRate),
      history:Array.isArray(imported.history)
        ? imported.history
        : [],
      autoLockMinutes:
        Math.max(
          1,
          Number(imported.autoLockMinutes) || 5
        ),
      passwordHash,
      locked:false
    };

    await saveState();

    renderAll();

    startAutoLockTimer();

    showToast("پشتیبان با موفقیت بازیابی شد");

  }catch(error){

    console.error(error);

    showToast(
      "فایل پشتیبان معتبر نیست"
    );
  }
}

/* =========================================================
   RENDER
========================================================= */

function renderAll(){

  renderRates();
  renderProducts();
  renderHistory();
  updateQuickResult();
  updateLockUI();
}

document
  .getElementById("rateBtn")
  .addEventListener("click",async()=>{

    if(state.locked){

      openPasswordModal("unlock");
      return;
    }

    const newRate =
      cleanNumber(
        document.getElementById("newRate").value
      );

    if(newRate <= 0){

      showToast(
        "نرخ جدید را وارد کنید"
      );

      return;
    }

    if(state.currentRate > 0){

      const oldRate =
        state.currentRate;

      const percent =
        ((newRate / oldRate) - 1) * 100;

      state.history.unshift({
        date:new Date()
          .toLocaleString("fa-IR"),
        oldRate,
        newRate,
        percent
      });

      /*
        نرخ قبلی برای محاسبه قیمت‌ها
        همان نرخ قبل از تغییر است.
      */

      state.oldRate =
        oldRate;

    }else{

      /*
        اولین نرخ:
        قیمت جدید = قیمت فعلی
      */

      state.oldRate =
        newRate;
    }

    state.currentRate =
      newRate;

    await saveState();

    renderAll();

    resetAutoLockTimer();

    showToast(
      "نرخ جدید ثبت شد"
    );
  });

/* =========================================================
   PRODUCT CLICK
========================================================= */

document
  .getElementById("products")
  .addEventListener(
    "click",
    async e=>{

      const editBtn =
        e.target.closest(
          "[data-edit-product]"
        );

      if(editBtn){

        if(state.locked){

          openPasswordModal("unlock");
          return;
        }

        const id =
          editBtn.dataset.editProduct;

        const el =
          document.getElementById(
            "product-" + id
          );

        if(!el){
          return;
        }

        document
          .querySelectorAll(".product.open")
          .forEach(other=>{

            if(other !== el){
              other.classList.remove("open");
            }
          });

        el.classList.toggle("open");

        if(el.classList.contains("open")){

          const input =
            el.querySelector(".productName");

          if(input){

            setTimeout(()=>{
              input.focus();
            },30);
          }
        }

        resetAutoLockTimer();

        return;
      }

      const image =
        e.target.closest(
          "[data-image]"
        );

      if(image){

        document
          .getElementById("largeImage")
          .src =
            image.dataset.image;

        document
          .getElementById("imageModal")
          .classList.add("show");

        return;
      }

      const deleteBtn =
        e.target.closest(
          "[data-delete-product]"
        );

      if(deleteBtn){

        if(state.locked){

          openPasswordModal("unlock");
          return;
        }

        const id =
          deleteBtn.dataset.deleteProduct;

        const product =
          state.products.find(
            p=>p.id === id
          );

        if(!product){
          return;
        }

        if(!confirm(
          `آیا کالا «${product.name}» حذف شود؟`
        )){
          return;
        }

        state.products =
          state.products.filter(
            p=>p.id !== id
          );

        await saveState();

        renderProducts();

        showToast("کالا حذف شد");

        resetAutoLockTimer();

        return;
      }

      const closeBtn =
        e.target.closest(
          "[data-close-product]"
        );

      if(closeBtn){

        const id =
          closeBtn.dataset.closeProduct;

        const el =
          document.getElementById(
            "product-" + id
          );

        if(el){
          el.classList.remove("open");
        }

        return;
      }

      const scanBtn =
        e.target.closest(
          "[data-scan-product]"
        );

      if(scanBtn){

        if(state.locked){

          openPasswordModal("unlock");
          return;
        }

        openScanner({
          type:"product",
          id:scanBtn.dataset.scanProduct
        });

        return;
      }
    }
  );

/* =========================================================
   PRODUCT INPUT
   بدون render هنگام تایپ
========================================================= */

document
  .getElementById("products")
  .addEventListener(
    "input",
    async e=>{

      if(state.locked){
        return;
      }

      const input = e.target;

      if(
        !input.classList.contains("productPrice") &&
        !input.classList.contains("productName") &&
        !input.classList.contains("productQR")
      ){
        return;
      }

      const id =
        input.dataset.id;

      const product =
        state.products.find(
          p=>p.id === id
        );

      if(!product){
        return;
      }

      if(
        input.classList.contains(
          "productPrice"
        )
      ){

        product.price =
          cleanNumber(input.value);
      }

      if(
        input.classList.contains(
          "productName"
        )
      ){

        product.name =
          input.value;
      }

      if(
        input.classList.contains(
          "productQR"
        )
      ){

        product.qr =
          input.value;
      }

      if(
        input.classList.contains(
          "productPrice"
        )
      ){

        const result =
          calculateProduct(product);

        const words =
          document.getElementById(
            "words-" + id
          );

        if(words){

          words.textContent =
            numberToWords(
              product.price
            );
        }

        const row =
          document.getElementById(
            "product-" + id
          );

        if(row){

          const current =
            row.querySelector(
              ".current-price"
            );

          if(current){

            current.textContent =
              "فعلی: " +
              money(product.price) +
              " تومان";
          }

          const newPrice =
            row.querySelector(
              ".new-price"
            );

          if(newPrice){

            newPrice.textContent =
              "جدید: " +
              money(
                Math.round(
                  result.newPrice
                )
              ) +
              " تومان";
          }

          const change =
            row.querySelector(
              ".change"
            );

          if(change){

            change.className =
              "change " +
              (
                result.diff > 0
                  ? "up"
                  : result.diff < 0
                    ? "down"
                    : ""
              );

            change.textContent =
              result.diff === 0
                ? "بدون تغییر"
                : "تغییر: " +
                  money(
                    Math.abs(
                      result.diff
                    )
                  ) +
                  " تومان (" +
                  result.percent
                    .toFixed(4) +
                  "٪)";
          }

          const disabledInputs =
            row.querySelectorAll(
              ".field input[disabled]"
            );

          if(disabledInputs.length >= 2){

            disabledInputs[0].value =
              money(
                Math.round(
                  result.newPrice
                )
              ) +
              " تومان";

            disabledInputs[1].value =
              result.percent
                .toFixed(4) +
              "٪";
          }
        }
      }

      /*
        ذخیره می‌شود ولی DOM دوباره ساخته نمی‌شود؛
        بنابراین کیبورد موبایل بسته نمی‌شود.
      */

      await saveState();

      resetAutoLockTimer();

      if(
        input.classList.contains(
          "productName"
        ) ||
        input.classList.contains(
          "productQR"
        )
      ){

        updateQuickResult();
      }
    }
  );

/* =========================================================
   IMAGE CHANGE
========================================================= */

document
  .getElementById("products")
  .addEventListener(
    "change",
    async e=>{

      if(state.locked){
        return;
      }

      const input = e.target;

      if(
        !input.classList.contains(
          "productImageInput"
        )
      ){
        return;
      }

      const file =
        input.files?.[0];

      if(!file){
        return;
      }

      const product =
        state.products.find(
          p=>p.id === input.dataset.id
        );

      if(!product){
        return;
      }

      try{

        product.image =
          await compressImage(file);

        await saveState();

        const wasOpen =
          document
            .getElementById(
              "product-" + product.id
            )
            ?.classList.contains("open");

        renderProducts();

        const el =
          document.getElementById(
            "product-" + product.id
          );

        if(wasOpen && el){
          el.classList.add("open");
        }

        showToast(
          "تصویر کالا ذخیره شد"
        );

      }catch(error){

        console.error(error);

        showToast(
          "ذخیره تصویر ناموفق بود"
        );
      }

      resetAutoLockTimer();
    }
  );

/* =========================================================
   MOBILE SECURITY
   هنگام بازگشت سریع از انتخاب فایل قفل نمی‌شود.
   اگر صفحه بیشتر از ۴۵ ثانیه مخفی باشد قفل می‌شود.
========================================================= */

document.addEventListener(
  "visibilitychange",
  ()=>{

    if(document.hidden){

      clearTimeout(hiddenTimer);

      hiddenTimer =
        setTimeout(()=>{

          if(!document.hidden){
            return;
          }

          if(!state.locked){
            lockNow(false);
          }

        },45000);

    }else{

      clearTimeout(hiddenTimer);

      if(!state.locked){
        resetAutoLockTimer();
      }
    }
  }
);

/* =========================================================
   KEYBOARD SHORTCUT
========================================================= */

document.addEventListener(
  "keydown",
  e=>{

    if(
      e.key === "/" &&
      document.activeElement.tagName !== "INPUT" &&
      document.activeElement.tagName !== "TEXTAREA"
    ){

      e.preventDefault();

      const search =
        document.getElementById(
          "searchInput"
        );

      search.focus();
    }
  }
);

/* =========================================================
   INIT
========================================================= */

async function init(){

  try{

    await openDB();

    await loadState();

    /*
      اگر برنامه برای اولین بار اجرا شده،
      رمز پیش‌فرض وجود ندارد و کاربر باید
      خودش رمز مالک بسازد.
    */

    if(!state.passwordHash){

      renderAll();

      openSetupModal();

      return;
    }

    /*
      برنامه همیشه بعد از باز شدن قفل است.
    */

    state.locked = true;

    await saveState();

    renderAll();

    updateLockUI();

  }catch(error){

    console.error(error);

    alert(
      "خطا در راه‌اندازی برنامه. صفحه را دوباره باز کنید."
    );
  }
}

   SERVICE WORKER

  window.addEventListener(

      navigator.serviceWorker
        .register("./sw.js")
        .catch(error=>{
          console.error(
            "Service Worker:",
            error
          );
        });
    }
  );
}

init();
